<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAD Music</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <h1>MAD Music</h1>
      <nav>
        <ul>
          <li><a href="#inicio">Início</a></li>
          <li><a href="#playlist">Playlist</a></li>
          <li><a href="#login">Login</a></li>
        </ul>
      </nav>
      <button class="botao-busca" aria-label="Buscar">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </header>
    <main>
      <section id="inicio">
        <h2>Bloco dos Apaixonados</h2>
        <div class="galeria-imagens">
          <div class="musica">
            <p>Sotam - Bloco dos Apaixonados - 2026</p>
            <img
              src="./images/Bloco dos apaixonados.jpg"
              alt="Bloco dos Apaixonados-LEGO"
            />
          </div>
          <div class="musica">
            <p>Baco Exu Do Blues - Lágrimas - 2022</p>
            <img
              src="./images/Baco Lagrimas.jpg"
              alt=" Stream Lágrimas (feat. Gal Costa) by Baco Exu do Blues"
            />
          </div>
          <div class="musica">
            <p>2ZDinizz - Beatriz - 2025</p>
            <img src="./images/Beatriz.jpg" alt="Beatriz - 2ZDinizz" />
          </div>
          <div class="musica">
            <p>Delacruz - Pensando Direito - 2026</p>
            <img
              src="./images/PensandoDireito.jpg"
              alt="pensando direito - Delacruz"
            />
          </div>
          <div class="musica">
            <p>Delacruz - Sunshine - 2019</p>
            <img
              src="./images/Sunshine.jpg"
              alt="Sunshine – música de Delacruz"
            />
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
